 # Notify events
 ef_events.1001.t:0 "An Exalted Faithful Appointed"
 ef_events.1001.desc:0 "You have elevated a trusted soul as Exalted Faithful. Their piety and Learning will serve your faith â€” so long as they remain bound to you."
